<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <defs>
    <style>
      .title { font: 700 20px/1.2 Arial, Helvetica, sans-serif; }
      .subtitle { font: 500 12px/1 Arial, Helvetica, sans-serif; fill: #475569; }
      .section-label { font: 600 13px Arial, Helvetica, sans-serif; fill: #334155; }
      .axis-label { font: 600 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .time-label { font: 500 10px Arial, Helvetica, sans-serif; fill: #475569; }
      .load-label { font: 700 12px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .stage-label { font: 500 10px Arial, Helvetica, sans-serif; fill: #0f172a; text-anchor: middle; }
      .annotation { font: 600 13px Arial, Helvetica, sans-serif; fill: #06b6d4; font-weight: bold; }
      .wash { fill: #bfdbfe; stroke: #3b82f6; stroke-width: 1.5; }
      .dry { fill: #bbf7d0; stroke: #10b981; stroke-width: 1.5; }
      .fold { fill: #fbcfe8; stroke: #ec4899; stroke-width: 1.5; }
      .store { fill: #e9d5ff; stroke: #a855f7; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" />
  <text x="20" y="34" class="title">Washing-machine pipeline: Sequential vs Pipelined</text>
  <text x="20" y="56" class="subtitle">Each load (A, B, C, D) progresses through 4 stages: Wash → Dry → Fold → Store</text>

  <!-- ===== TOP DIAGRAM: SEQUENTIAL ===== -->
  <text x="20" y="110" class="section-label">Sequential Schedule (Non-Pipelined) — No Overlap</text>

  <!-- Timeline -->
  <line x1="100" y1="140" x2="1150" y2="140" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Decorative alternating blocks -->
  <rect x="100" y="133" width="130" height="14" fill="#1e293b" opacity="0.2" />
  <rect x="230" y="133" width="130" height="14" fill="#e9d5ff" opacity="0.3" />
  <rect x="360" y="133" width="130" height="14" fill="#1e293b" opacity="0.2" />
  <rect x="490" y="133" width="130" height="14" fill="#e9d5ff" opacity="0.3" />
  <rect x="620" y="133" width="130" height="14" fill="#1e293b" opacity="0.2" />
  <rect x="750" y="133" width="130" height="14" fill="#e9d5ff" opacity="0.3" />
  <rect x="880" y="133" width="130" height="14" fill="#1e293b" opacity="0.2" />
  <rect x="1010" y="133" width="130" height="14" fill="#e9d5ff" opacity="0.3" />

  <!-- Hour ticks and labels -->
  <line x1="100" y1="140" x2="100" y2="152" stroke="#475569" stroke-width="1.5" />
  <text x="100" y="168" class="time-label" text-anchor="middle">6PM</text>
  <line x1="230" y1="140" x2="230" y2="152" stroke="#475569" stroke-width="1.5" />
  <text x="230" y="168" class="time-label" text-anchor="middle">7</text>
  <line x1="360" y1="140" x2="360" y2="152" stroke="#475569" stroke-width="1.5" />
  <text x="360" y="168" class="time-label" text-anchor="middle">8</text>
  <line x1="490" y1="140" x2="490" y2="152" stroke="#475569" stroke-width="1.5" />
  <text x="490" y="168" class="time-label" text-anchor="middle">9</text>
  <line x1="620" y1="140" x2="620" y2="152" stroke="#475569" stroke-width="1.5" />
  <text x="620" y="168" class="time-label" text-anchor="middle">10</text>
  <line x1="750" y1="140" x2="750" y2="152" stroke="#475569" stroke-width="1.5" />
  <text x="750" y="168" class="time-label" text-anchor="middle">11</text>
  <line x1="880" y1="140" x2="880" y2="152" stroke="#475569" stroke-width="1.5" />
  <text x="880" y="168" class="time-label" text-anchor="middle">12</text>
  <line x1="1010" y1="140" x2="1010" y2="152" stroke="#475569" stroke-width="1.5" />
  <text x="1010" y="168" class="time-label" text-anchor="middle">1</text>
  <line x1="1140" y1="140" x2="1140" y2="152" stroke="#475569" stroke-width="1.5" />
  <text x="1140" y="168" class="time-label" text-anchor="middle">2</text>

  <!-- Y-axis label -->
  <text x="30" y="290" class="axis-label" text-anchor="middle">Task</text>
  <text x="30" y="310" class="axis-label" text-anchor="middle">order</text>

  <!-- Load A: 6-8 PM (4 stages, 30 min each: Wash 6-6:30, Dry 6:30-7, Fold 7-7:30, Store 7:30-8) -->
  <g id="seq-load-a">
    <text x="50" y="220" class="load-label">A</text>
    <rect x="100" y="195" width="65" height="40" rx="2" class="wash" />
    <text x="132" y="225" class="stage-label">Wash</text>
    <rect x="165" y="195" width="65" height="40" rx="2" class="dry" />
    <text x="197" y="225" class="stage-label">Dry</text>
    <rect x="230" y="195" width="65" height="40" rx="2" class="fold" />
    <text x="262" y="225" class="stage-label">Fold</text>
    <rect x="295" y="195" width="65" height="40" rx="2" class="store" />
    <text x="327" y="225" class="stage-label">Store</text>
  </g>

  <!-- Load B: 8-10 PM (same 4-stage pattern, begins when A Store ends) -->
  <g id="seq-load-b">
    <text x="50" y="290" class="load-label">B</text>
    <rect x="360" y="265" width="65" height="40" rx="2" class="wash" />
    <text x="392" y="295" class="stage-label">Wash</text>
    <rect x="425" y="265" width="65" height="40" rx="2" class="dry" />
    <text x="457" y="295" class="stage-label">Dry</text>
    <rect x="490" y="265" width="65" height="40" rx="2" class="fold" />
    <text x="522" y="295" class="stage-label">Fold</text>
    <rect x="555" y="265" width="65" height="40" rx="2" class="store" />
    <text x="587" y="295" class="stage-label">Store</text>
  </g>

  <!-- Load C: 10-12 AM (begins when B Store ends) -->
  <g id="seq-load-c">
    <text x="50" y="360" class="load-label">C</text>
    <rect x="620" y="335" width="65" height="40" rx="2" class="wash" />
    <text x="652" y="365" class="stage-label">Wash</text>
    <rect x="685" y="335" width="65" height="40" rx="2" class="dry" />
    <text x="717" y="365" class="stage-label">Dry</text>
    <rect x="750" y="335" width="65" height="40" rx="2" class="fold" />
    <text x="782" y="365" class="stage-label">Fold</text>
    <rect x="815" y="335" width="65" height="40" rx="2" class="store" />
    <text x="847" y="365" class="stage-label">Store</text>
  </g>

  <!-- Load D: 12-2 AM (begins when C Store ends) -->
  <g id="seq-load-d">
    <text x="50" y="430" class="load-label">D</text>
    <rect x="880" y="405" width="65" height="40" rx="2" class="wash" />
    <text x="912" y="435" class="stage-label">Wash</text>
    <rect x="945" y="405" width="65" height="40" rx="2" class="dry" />
    <text x="977" y="435" class="stage-label">Dry</text>
    <rect x="1010" y="405" width="65" height="40" rx="2" class="fold" />
    <text x="1042" y="435" class="stage-label">Fold</text>
    <rect x="1075" y="405" width="65" height="40" rx="2" class="store" />
    <text x="1107" y="435" class="stage-label">Store</text>
  </g>

  <!-- ===== BOTTOM DIAGRAM: PIPELINED ===== -->
  <text x="20" y="530" class="section-label">Pipelined Schedule (Overlapping) — Stages Running in Parallel</text>

  <!-- Timeline -->
  <line x1="100" y1="560" x2="1150" y2="560" stroke="#cbd5e1" stroke-width="2" />

  <!-- Hour ticks and labels -->
  <line x1="100" y1="560" x2="100" y2="572" stroke="#475569" stroke-width="1.5" />
  <text x="100" y="588" class="time-label" text-anchor="middle">6PM</text>
  <line x1="230" y1="560" x2="230" y2="572" stroke="#475569" stroke-width="1.5" />
  <text x="230" y="588" class="time-label" text-anchor="middle">7</text>
  <line x1="360" y1="560" x2="360" y2="572" stroke="#475569" stroke-width="1.5" />
  <text x="360" y="588" class="time-label" text-anchor="middle">8</text>
  <line x1="490" y1="560" x2="490" y2="572" stroke="#475569" stroke-width="1.5" />
  <text x="490" y="588" class="time-label" text-anchor="middle">9</text>
  <line x1="620" y1="560" x2="620" y2="572" stroke="#475569" stroke-width="1.5" />
  <text x="620" y="588" class="time-label" text-anchor="middle">10</text>
  <line x1="750" y1="560" x2="750" y2="572" stroke="#475569" stroke-width="1.5" />
  <text x="750" y="588" class="time-label" text-anchor="middle">11</text>
  <line x1="880" y1="560" x2="880" y2="572" stroke="#475569" stroke-width="1.5" />
  <text x="880" y="588" class="time-label" text-anchor="middle">12</text>
  <line x1="1010" y1="560" x2="1010" y2="572" stroke="#475569" stroke-width="1.5" />
  <text x="1010" y="588" class="time-label" text-anchor="middle">1</text>

  <!-- Y-axis label -->
  <text x="30" y="710" class="axis-label" text-anchor="middle">Task</text>
  <text x="30" y="730" class="axis-label" text-anchor="middle">order</text>

  <!-- Load A: Starts 6 PM -->
  <g id="pipe-load-a">
    <text x="50" y="680" class="load-label">A</text>
    <rect x="100" y="655" width="65" height="40" rx="2" class="wash" />
    <text x="132" y="685" class="stage-label">Wash</text>
    <rect x="165" y="655" width="65" height="40" rx="2" class="dry" />
    <text x="197" y="685" class="stage-label">Dry</text>
    <rect x="230" y="655" width="65" height="40" rx="2" class="fold" />
    <text x="262" y="685" class="stage-label">Fold</text>
    <rect x="295" y="655" width="65" height="40" rx="2" class="store" />
    <text x="327" y="685" class="stage-label">Store</text>
  </g>

  <!-- Load B: Starts 6:30 PM -->
  <g id="pipe-load-b">
    <text x="50" y="765" class="load-label">B</text>
    <rect x="165" y="740" width="65" height="40" rx="2" class="wash" />
    <text x="197" y="770" class="stage-label">Wash</text>
    <rect x="230" y="740" width="65" height="40" rx="2" class="dry" />
    <text x="262" y="770" class="stage-label">Dry</text>
    <rect x="295" y="740" width="65" height="40" rx="2" class="fold" />
    <text x="327" y="770" class="stage-label">Fold</text>
    <rect x="360" y="740" width="65" height="40" rx="2" class="store" />
    <text x="392" y="770" class="stage-label">Store</text>
  </g>

  <!-- Load C: Starts 7 PM -->
  <g id="pipe-load-c">
    <text x="50" y="850" class="load-label">C</text>
    <rect x="230" y="825" width="65" height="40" rx="2" class="wash" />
    <text x="262" y="855" class="stage-label">Wash</text>
    <rect x="295" y="825" width="65" height="40" rx="2" class="dry" />
    <text x="327" y="855" class="stage-label">Dry</text>
    <rect x="360" y="825" width="65" height="40" rx="2" class="fold" />
    <text x="392" y="855" class="stage-label">Fold</text>
    <rect x="425" y="825" width="65" height="40" rx="2" class="store" />
    <text x="457" y="855" class="stage-label">Store</text>
  </g>

  <!-- Load D: Starts 7:30 PM -->
  <g id="pipe-load-d">
    <text x="50" y="935" class="load-label">D</text>
    <rect x="295" y="910" width="65" height="40" rx="2" class="wash" />
    <text x="327" y="940" class="stage-label">Wash</text>
    <rect x="360" y="910" width="65" height="40" rx="2" class="dry" />
    <text x="392" y="940" class="stage-label">Dry</text>
    <rect x="425" y="910" width="65" height="40" rx="2" class="fold" />
    <text x="457" y="940" class="stage-label">Fold</text>
    <rect x="490" y="910" width="65" height="40" rx="2" class="store" />
    <text x="522" y="940" class="stage-label">Store</text>
  </g>
</svg>
